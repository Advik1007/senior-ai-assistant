<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>UNK AI</title>
    <style>
      :root {
        --bg: #0b4f8a;
        --fg: #ffffff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(circle at 20% 20%, #1263a8, var(--bg) 55%);
        color: var(--fg);
        padding: 1.5rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 2.75rem;
        letter-spacing: 0.04em;
      }
      p {
        margin: 0;
        font-size: 1.35rem;
        opacity: 0.95;
      }
      .dot {
        display: inline-block;
        width: 0.55rem;
        height: 0.55rem;
        margin: 1.25rem 0.2rem 0;
        border-radius: 999px;
        background: #f4b400;
        animation: pulse 1.1s ease-in-out infinite;
      }
      .dot:nth-child(2) {
        animation-delay: 0.15s;
      }
      .dot:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.35;
          transform: translateY(0);
        }
        50% {
          opacity: 1;
          transform: translateY(-4px);
        }
      }
    </style>
  </head>
  <body>
    <div>
      <h1>UNK AI</h1>
      <p>Loading…</p>
      <div aria-hidden="true">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
    <script src="./offline-config.js"></script>
    <script>
      (function () {
        var target =
          (typeof window.UNK_SERVER_URL === "string" &&
            window.UNK_SERVER_URL.trim()) ||
          "";
        var attempt = 0;
        try {
          attempt = Number(sessionStorage.getItem("unk_retry") || "0") || 0;
        } catch (e) {}

        function go() {
          attempt += 1;
          try {
            sessionStorage.setItem("unk_retry", String(attempt));
          } catch (e) {}

          if (target) {
            window.location.replace(target);
            return;
          }
          // Fallback: try going back to the previous app URL.
          window.location.replace("/");
        }

        // Quiet auto-retry: short delay first, then gently backs off.
        var delay = Math.min(8000, 900 + attempt * 700);
        window.setTimeout(go, delay);
      })();
    </script>
  </body>
</html>
